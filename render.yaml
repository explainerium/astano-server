# Render blueprint for the astano API — free-tier testing setup.
#
# Deploy with: New → Blueprint → point at this repo.
# Everything marked `sync: false` is filled in from the Render dashboard;
# nothing secret belongs in this file.
#
# ── Two deliberate choices for the free tier ────────────────────────────────
#
# 1. No `databases:` block. Render's free Postgres expires, and losing the
#    database mid-test is worse than one extra signup. Use Neon (or any hosted
#    Postgres) and paste its connection string into DATABASE_URL.
#
# 2. Migrations run in the build command, not `preDeployCommand`. Pre-deploy
#    commands need a paid instance type. `migrate deploy` is idempotent, so
#    running it every build is safe.

services:
  - type: web
    name: astano-api
    runtime: node
    plan: free # sleeps after ~15 min idle; the next request takes ~50s
    region: frankfurt
    branch: main
    rootDir: .

    # `--include=dev` is not optional here. NODE_ENV=production (set below, and
    # needed at runtime) makes npm skip devDependencies — and TypeScript plus
    # every @types/* package lives there. Without it the build fails with a
    # hundred "Could not find a declaration file for module 'express'" errors,
    # which reads like missing packages rather than a skipped install.
    #
    # `prisma generate` must run every build: Render builds from a clean cache
    # and the generated client is not committed.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build

    startCommand: npm start

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # Render supplies PORT; the app already reads it.

      # Neon connection string. Keep the ?sslmode=require Neon gives you —
      # Prisma needs it.
      - key: DATABASE_URL
        sync: false

      # Set this whenever DATABASE_URL above is a *transaction* pooler — a
      # Supabase :6543 / `pgbouncer=true` string, or PgBouncer in transaction
      # mode. That kind of connection keeps no session state, so the advisory
      # lock `prisma migrate deploy` takes is never granted, so the buildCommand
      # above hangs on it rather than failing: no error to read, just a deploy
      # that never finishes. Point it at a session-holding connection —
      # for Supabase, the same host and credentials on port 5432.
      #
      # Leave it unset on a direct connection, which is what Neon hands you.
      - key: DIRECT_URL
        sync: false

      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # Encrypts the payment credentials the client enters in the dashboard.
      #
      # `sync: false` and NOT `generateValue`, deliberately. A generated value is
      # one nobody has written down, and recreating this service from the
      # blueprint would generate a different one — at which point every stored
      # Stripe and PayPal key decrypts to nothing and the client has to paste
      # them all in again with the shop unable to take payment.
      #
      # Set it once in the Render dashboard, keep a copy somewhere safe, and
      # treat it as permanent:
      #   openssl rand -hex 32
      - key: CREDENTIALS_KEY
        sync: false

      # ── The two that decide whether guest carts work ────────────────────
      #
      # A Vercel frontend and a Render API are different sites, so every API
      # call is cross-site and a SameSite=Lax cookie is silently dropped —
      # the basket empties itself between page loads with nothing in any log.
      #
      # On the Hostinger VPS later, where both sit on one domain, set this
      # back to `lax`.
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"

      # Comma-separated, exact scheme + host, no trailing slash.
      # e.g. https://astano.vercel.app,https://astano-git-main-you.vercel.app
      - key: CORS_ORIGINS
        sync: false

      # Where this API is reachable — used to build media URLs.
      # e.g. https://astano-api.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false

      # Where the SHOP is — the origin a customer opens, which is NOT this API.
      #
      # Every link in every email comes from here: password resets, the welcome
      # mail, quote links, and the dashboard link staff get when a print file
      # arrives after an order. They used to be built from PUBLIC_BASE_URL, so a
      # password reset arrived pointing at the API and answered 404 in JSON.
      #
      # Optional: left unset it falls back to the first entry in CORS_ORIGINS,
      # which is correct here. Set it when several origins are allowed and the
      # first is not the customer-facing one.
      # e.g. https://astano.vercel.app
      - key: SHOP_BASE_URL
        sync: false

      # Render's filesystem is ephemeral: with the local driver every uploaded
      # product image disappears on the next deploy.
      #
      # The driver is plain S3. Cloudflare R2 asks for a card even on its free
      # tier, so for a card-free test deployment use Supabase Storage and set
      # S3_ENDPOINT / S3_FORCE_PATH_STYLE below.
      - key: STORAGE_DRIVER
        value: r2
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_MEDIA
        sync: false
      - key: R2_BUCKET_FILES
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # Cloudflare R2 only — leave unset when S3_ENDPOINT is set.
      - key: R2_ACCOUNT_ID
        sync: false
      # Everything else — e.g. https://<ref>.supabase.co/storage/v1/s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_FORCE_PATH_STYLE
        sync: false

      # Without these, order confirmations and password resets send from
      # nothing. MAIL_FROM must be an address the SMTP host will accept.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

      - key: LOG_LEVEL
        value: info

      # Nothing here for invoice PDFs any more. They used to need Puppeteer's
      # own Chromium — 847 MB, and the one feature most likely to run a 512 MB
      # instance out of memory. They are drawn in-process now (2.6 MB, no
      # browser), so there is nothing to download and nothing to warn about.
