# Render blueprint for the astano API — free-tier testing setup.
#
# Deploy with: New → Blueprint → point at this repo.
# Everything marked `sync: false` is filled in from the Render dashboard;
# nothing secret belongs in this file.
#
# ── Two deliberate choices for the free tier ────────────────────────────────
#
# 1. No `databases:` block. Render's free Postgres expires, and losing the
#    database mid-test is worse than one extra signup. Use Neon (or any hosted
#    Postgres) and paste its connection string into DATABASE_URL.
#
# 2. Migrations run in the build command, not `preDeployCommand`. Pre-deploy
#    commands need a paid instance type. `migrate deploy` is idempotent, so
#    running it every build is safe.

services:
  - type: web
    name: astano-api
    runtime: node
    plan: free # sleeps after ~15 min idle; the next request takes ~50s
    region: frankfurt
    branch: main
    rootDir: .

    # `prisma generate` must run every build — Render builds from a clean
    # cache and the generated client is not committed.
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build

    startCommand: npm start

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # Render supplies PORT; the app already reads it.

      # Neon connection string. Keep the ?sslmode=require Neon gives you —
      # Prisma needs it.
      - key: DATABASE_URL
        sync: false

      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # ── The two that decide whether guest carts work ────────────────────
      #
      # A Vercel frontend and a Render API are different sites, so every API
      # call is cross-site and a SameSite=Lax cookie is silently dropped —
      # the basket empties itself between page loads with nothing in any log.
      #
      # On the Hostinger VPS later, where both sit on one domain, set this
      # back to `lax`.
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"

      # Comma-separated, exact scheme + host, no trailing slash.
      # e.g. https://astano.vercel.app,https://astano-git-main-you.vercel.app
      - key: CORS_ORIGINS
        sync: false

      # Where this API is reachable — used to build media URLs.
      # e.g. https://astano-api.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false

      # Render's filesystem is ephemeral: with the local driver every uploaded
      # product image disappears on the next deploy.
      #
      # The driver is plain S3. Cloudflare R2 asks for a card even on its free
      # tier, so for a card-free test deployment use Supabase Storage and set
      # S3_ENDPOINT / S3_FORCE_PATH_STYLE below.
      - key: STORAGE_DRIVER
        value: r2
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_MEDIA
        sync: false
      - key: R2_BUCKET_FILES
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # Cloudflare R2 only — leave unset when S3_ENDPOINT is set.
      - key: R2_ACCOUNT_ID
        sync: false
      # Everything else — e.g. https://<ref>.supabase.co/storage/v1/s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_FORCE_PATH_STYLE
        sync: false

      # Without these, order confirmations and password resets send from
      # nothing. MAIL_FROM must be an address the SMTP host will accept.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

      - key: LOG_LEVEL
        value: info

      # Puppeteer ships its own Chromium for invoice PDFs. On a 512 MB free
      # instance launching it may run the process out of memory — see
      # DEPLOYMENT.md. Leave the download enabled; if invoices are not needed
      # for this round of testing, that is the one feature to expect trouble
      # from.
